name: CI & Auto Release

on:
  push:
    branches:
      - master
    paths:
      - 'opentask-api/**'
      - 'opentask-app/**'
      - '.github/workflows/ci.yml'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force build & release the desktop even if the version already exists'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: offside-software/opentask-rust-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./opentask-api
          file: ./opentask-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-dewacloud:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on DewaCloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEWACLOUD_SSH_HOST }}
          port: ${{ vars.DEWACLOUD_SSH_PORT }}
          username: ${{ vars.DEWACLOUD_SSH_USER }}
          key: ${{ secrets.DEWACLOUD_SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker stop rust-api || true
            docker rm rust-api || true
            docker run -d --name rust-api --restart unless-stopped -p 80:8000 --env-file ~/OpenTask/.env \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker image prune -af --filter "until=24h"

  deploy-to-vercel:
    # Deploy the web app (and API rewrites) only after the Rust API is live.
    needs: deploy-to-dewacloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  # ==========================================
  # JOB 4: Build & Auto Release Desktop App
  # Runs automatically when tauri version changes inside tauri.conf.json
  # ==========================================
  release-desktop:
    name: Build & Release Desktop App
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Tauri Version Changes
        id: version_check
        shell: bash
        run: |
          VERSION=$(node -p "require('./opentask-app/src-tauri/tauri.conf.json').version")
          echo "Target Desktop Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          TAG_EXISTS=false
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            TAG_EXISTS=true
          fi

          FORCE="${{ inputs.force_release }}"

          if [ "$TAG_EXISTS" = "false" ] || [ "$FORCE" = "true" ]; then
            echo "Tag v$VERSION not found on GitHub (or force_release active). Starting desktop build..."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION already exists on GitHub Release. Skipping desktop build."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun Environment
        if: steps.version_check.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        if: steps.version_check.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo & Rust
        if: steps.version_check.outputs.should_release == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./opentask-app/src-tauri"

      - name: Install Frontend Dependencies
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./opentask-app
        run: bun install

      - name: Build & Sign Desktop App
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./opentask-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri:build:signed

      - name: Publish GitHub Release (Tag & Assets)
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: OpenTask Desktop v${{ steps.version_check.outputs.version }}
          body: |
            ### OpenTask Desktop v${{ steps.version_check.outputs.version }}
            Automated release built and signed by GitHub Actions CI/CD.

            #### Downloads:
            * Download the Windows installer (`-setup.exe`) below.
            * Existing OpenTask desktop installations will automatically detect and install this update.
          draft: false
          prerelease: false
          files: |
            opentask-app/src-tauri/target/release/bundle/nsis/OpenTask_${{ steps.version_check.outputs.version }}_x64-setup.exe
            opentask-app/src-tauri/target/release/bundle/nsis/OpenTask_${{ steps.version_check.outputs.version }}_x64-setup.exe.sig
            opentask-app/src-tauri/target/release/bundle/nsis/latest.json

