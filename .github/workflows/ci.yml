name: Build & Deploy Rust API

on:
  push:
    branches:
      - master
    paths:
      - 'opentask-api/**'
      - '.github/workflows/ci.yml'
      - 'Dockerfile.vercel'
      - 'docker.vercel'
      - 'vercel.json'
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: offside-software/opentask-rust-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./opentask-api
          file: ./opentask-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vercel:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Vercel Redeployment via Deploy Hook
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel deployment with fresh GHCR image..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Deploy to Vercel via CLI
        if: ${{ env.VERCEL_DEPLOY_HOOK == '' && env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Triggering Vercel CLI production deployment..."
          npx --yes vercel deploy --prod --token="$VERCEL_TOKEN"

      - name: Notification if Vercel webhook/token not yet configured
        if: ${{ env.VERCEL_DEPLOY_HOOK == '' && env.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice title=Vercel Redeployment::Rust API image built and published to GHCR (ghcr.io/${{ env.IMAGE_NAME }}:latest). To automatically trigger Vercel deployment after CI, configure VERCEL_DEPLOY_HOOK or VERCEL_TOKEN in your GitHub repository secrets."
