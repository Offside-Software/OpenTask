services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: opentask_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  rust-api:
    build:
      context: ./opentask-api
      dockerfile: Dockerfile
    container_name: opentask_rust_api
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env


  redis:
    image: redis:7-alpine
    container_name: opentask_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: opentask_celery_worker
    restart: unless-stopped
    command: celery -A routers.cornjob.app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis

  celery_beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: opentask_celery_beat
    restart: unless-stopped
    command: celery -A routers.cornjob.app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis_data:
